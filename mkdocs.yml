site_name: PyCPU
site_url: https://robcox2910.github.io/pycpu/
repo_url: https://github.com/robcox2910/pycpu
repo_name: robcox2910/pycpu

# theme:start
theme:
  name: material
  palette:
    - scheme: default
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.highlight
# theme:end

exclude_docs: |
  superpowers/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables

nav:
  - Home: index.md
  - From Scratch: from-scratch.md
  - The Basics:
      - Bits and Binary: concepts/bits-and-binary.md
      - Switches and NAND: concepts/switches-and-nand.md
      - Simulating a Circuit: concepts/simulating-a-circuit.md
      - Logic Gates from NAND: concepts/gates.md
      - Choosing and Decoding: concepts/choosing-and-decoding.md
      - Looking Inside a Circuit: concepts/looking-inside.md
      - Adding: concepts/adding.md
      - Negative Numbers: concepts/negative-numbers.md
      - The ALU: concepts/the-alu.md
      - Remembering: concepts/remembering.md
      - The Clock: concepts/the-clock.md
      - Registers: concepts/registers.md
      - RAM: concepts/ram.md
      - How Big Is Our Memory?: concepts/how-big-is-our-memory.md
  - The Computer:
      - What Is a CPU?: concepts/what-is-a-cpu.md
      - Machine Code: concepts/machine-code.md
      - Assembly Language: concepts/assembly-language.md
      - The Control Unit: concepts/the-control-unit.md
      - Fetch, Decode, Execute: concepts/fetch-decode-execute.md
      - The Stack: concepts/the-stack.md
      - Calling and Returning: concepts/calling-and-returning.md
      - Two Engines: concepts/two-engines.md
      - Pausing and Rewinding: concepts/pausing-and-rewinding.md
  - Pebble on the CPU:
      - From Pebble to Machine Code: concepts/from-pebble-to-machine-code.md
      - Variables in Memory: concepts/variables-in-memory.md
      - Why 16-Bit Numbers Wrap: concepts/why-16-bit-numbers-wrap.md
      - Multiply and Divide: concepts/multiply-and-divide.md
      - Printing a Number: concepts/printing-a-number.md
  - The Bench: concepts/the-bench.md
  - Reference:
      - Instruction Set: reference/instruction-set.md
