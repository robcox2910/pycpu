name: Deploy Docs

# Manual only until Plan 5, so nothing deploys early. `series sync` restores
# the standard push trigger when PyCPU is ready to publish.
on:
  workflow_dispatch: {}

jobs:
  docs:
    uses: robcox2910/robcox2910.github.io/.github/workflows/docs.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      coverage-report: false
